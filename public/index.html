<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="DBMS: module priorities and FAT question papers.">
  <title>DBMS: FAT Question Papers</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    /* Set theme + mode before first paint so there is no flash. */
    (function () {
      var r = document.documentElement, t = "dark", m = "view";
      try { t = localStorage.getItem("cloud-theme2") === "light" ? "light" : "dark"; m = localStorage.getItem("dbms-mode") === "study" ? "study" : "view"; } catch (e) {}
      r.setAttribute("data-theme", t); r.setAttribute("data-mode", m);
    })();
  </script>
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/api.js">
  <link rel="preload" href="data/modules.json" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="data/papers.json" as="fetch" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#body">Skip to content</a>
  <div class="app">
    <main class="main">
      <div class="scroll" id="scroll">
        <div class="top">
          <span class="model">DBMS</span>
          <span class="sp"></span>
          <div class="seg" id="mode" role="group" aria-label="Mode">
          <span class="seg-pill" aria-hidden="true"></span>
          <button type="button" data-mode="view" aria-pressed="true">View</button>
          <button type="button" data-mode="study" aria-pressed="false">Study</button>
        </div>
        <a class="fat-btn fat-link" id="fatBtn" href="https://db-fat.vercel.app/" target="_blank" rel="noopener" aria-label="Open FAT question papers">fat</a>
        <button class="fat-btn" id="impBtn" type="button" aria-label="Open important notes">imp</button>
        <button class="imp-btn" id="distrBtn" type="button" aria-label="Open marks distribution">distr</button>
        <button class="icon-btn" id="cmpBtn" type="button" aria-label="Compare two modules" title="Compare modules (C)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="16" rx="2"/></svg></button>
        <button class="icon-btn" id="theme" aria-label="Switch to light mode" title="Toggle theme"></button>
        </div>
        <div class="col">
          <header class="hero" id="hero"><span class="eyebrow"><i></i>DBMS</span></header>
          <section class="cloud" aria-label="DBMS">
            <div class="cloud-head">
              <div class="hd-l"><button class="back-btn" id="back" type="button" hidden>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                dbms</button></div>
              <div class="cloud-title" id="title">dbms</div>
              <div class="hd-r"></div>
            </div>
            <div class="tabs-row" id="tabsRow">
              <div class="tabs" id="tabs" role="tablist"></div>
            </div>
            <div class="body" id="body" role="tabpanel"><div class="skel" aria-busy="true" aria-label="Loading"><i></i><i></i><i></i><i></i></div></div>
          </section>
        </div>
      </div>
      <div class="composer-wrap">
        <label class="composer" for="q">
          <input id="q" type="search" autocomplete="off">
          <span class="kbd" aria-hidden="true">/</span>
          <span class="count" id="count" hidden></span>
          <button class="send" type="button" id="clear" aria-label="Clear search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </label>
      </div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
  <script>if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });</script>
</body>
</html>
